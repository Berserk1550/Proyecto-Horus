<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modificar Tarifa</title>
</head>
<body>

    <header>
        <h1>Modificar Tarifa</h1>
    </header>

    <main>
        <form action="/modificar_tarifa/{{ tarifa.id_tarifas }}" method="post">

        <fieldset>
            <legend>Configuración de la Tarifa</legend>

            <label for="tipo_tarifa">Tipo de Tarifa:</label>
            <select id="tipo_tarifa" name="tipo_tarifa" required>
                <option value="primera_hora" {% if tarifa.tipo_tarifa == 'primera_hora' %}selected{% endif %}>Valor primera hora</option>
                <option value="hora_extra" {% if tarifa.tipo_tarifa == 'hora_extra' %}selected{% endif %}>Valor hora extra</option>
                <option value="jornada" {% if tarifa.tipo_tarifa == 'jornada' %}selected{% endif %}>Valor jornada</option>
                <option value="dia_completo" {% if tarifa.tipo_tarifa == 'dia_completo' %}selected{% endif %}>Valor día completo</option>
            </select>

            <label for="horario">Horario:</label>
            <select id="horario" name="horario" required>
                <option value="diurno" {% if tarifa.horario == 'diurno' %}selected{% endif %}>Diurno</option>
                <option value="nocturno" {% if tarifa.horario == 'nocturno' %}selected{% endif %}>Nocturno</option>
            </select>

            <label for="tipo_vehiculo">Tipo de Vehículo:</label>
            <select id="tipo_vehiculo" name="tipo_vehiculo" required>
                <option value="carro" {% if tarifa.tipo_vehiculo == 'carro' %}selected{% endif %}>Carro</option>
                <option value="moto" {% if tarifa.tipo_vehiculo == 'moto' %}selected{% endif %}>Moto</option>
            </select>

            <label for="valor_tarifa">Valor de la Tarifa:</label>
            <input 
                type="number" 
                id="valor_tarifa" 
                name="valor_tarifa" 
                min="0" 
                max="999999" 
                value="{{ tarifa.valor_tarifa }}"
                required
            >
        </fieldset>

        <fieldset>
            <legend>Horario Disponible</legend>

            <label for="hora_inicio">Hora de Inicio:</label>
            <input 
                type="time" 
                id="hora_inicio" 
                name="hora_inicio" 
                value="{{ tarifa.hora_inicio }}"
                required
            >

            <label for="hora_fin">Hora de Fin:</label>
            <input 
                type="time" 
                id="hora_fin" 
                name="hora_fin" 
                value="{{ tarifa.hora_fin }}"
                required
            >
        </fieldset>

        <button type="submit">Guardar Cambios</button>
        </form>

        <form action="/consultar_tarifas" method="get">
            <button type="submit">Volver</button>
        </form>
    </main>

</body>
</html>
