<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar Tarifas</title>
</head>
<body>

    <header>
        <h1>Tarifas Registradas</h1>
    </header>

    <main>
        <section>
            <table border="1">
                <thead>
                    <tr>
                        <th>Tipo de Tarifa</th>
                        <th>Horario</th>
                        <th>Tipo de Vehículo</th>
                        <th>Valor</th>
                        <th>Hora Inicio</th>
                        <th>Hora Fin</th>
                        <th>Acciones</th>
                    </tr>
                </thead>

                <tbody>
                    {% for tarifa in tarifas %}
                    <tr>
                        <td>{{ tarifa.tipo_tarifa }}</td>
                        <td>{{ tarifa.horario }}</td>
                        <td>{{ tarifa.tipo_vehiculo }}</td>
                        <td>{{ tarifa.valor_tarifa }}</td>
                        <td>{{ tarifa.hora_inicio }}</td>
                        <td>{{ tarifa.hora_fin }}</td>

                        <td>
                            <form action="/modificar_tarifa/{{ tarifa.id_tarifas }}" method="get" style="display:inline;">
                                <button type="submit">Modificar</button>
                            </form>

                            <form action="/eliminar_tarifa/{{ tarifa.id_tarifas }}" method="post" style="display:inline;">
                                <button type="submit">Eliminar</button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </section>

        <form action="/tarifas" method="get">
            <button type="submit">Volver</button>
        </form>
    </main>

</body>
</html>
