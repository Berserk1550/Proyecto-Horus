<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../static/dashboard.css" />
  <title>Opciones principales</title>
</head>
<body>
  <div>
    <main class="dashboard">

      <section class="card">
        
        <a href="/servicios" id="servicios">Gestión de servicios prestados</a>
      </section>

      <section class="card">
        
        <label for="gestion_usuarios" >Seleccione acción</label>
        <select id="gestion_usuarios" onchange="redirigirUsuario(this.value)">
          <option value="/admin/consultar_usuario">Consultar Usuarios</option>
          <option value="/admin/agregar_usuario">Crear Usuario</option>
        </select>

      </section>

      <section class="card">
        
        <a href="/parqueadero" id="parqueo">Gestionar parqueadero</a>
      </section>

      <section class="card">
        <a href="/tarifas" id="tarifas">Gestionar tarifas</a>
      </section>

      <section class="card">
        
        <a href="/convenios" id="convenios">Gestionar convenios</a>
      </section>

      

    </main>

    <script>
      function redirigirUsuario(ruta) {
        if (ruta) {
          window.location.href = ruta;
        }
      }
    </script>
  </div>
</body>
</html>
