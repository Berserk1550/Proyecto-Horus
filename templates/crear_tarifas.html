<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Tarifa</title>
</head>
<body>

    <header>
        <h1>Registrar Nueva Tarifa</h1>
    </header>

    <main>
        <form action="/crear_tarifas" method="post">

        <fieldset>
            <legend>Configuración de la Tarifa</legend>

            <label for="tipo_tarifa">Tipo de Tarifa:</label>
            <select id="tipo_tarifa" name="tipo_tarifa" required>
            <option value="" disabled selected>Seleccione...</option>
            <option value="primera_hora">Valor primera hora</option>
            <option value="hora_extra">Valor hora extra</option>
            <option value="jornada">Valor jornada</option>
            <option value="dia_completo">Valor día completo</option>
            </select>

            <label for="horario">Horario:</label>
            <select id="horario" name="horario" required>
            <option value="" disabled selected>Seleccione...</option>
            <option value="diurno">Diurno</option>
            <option value="nocturno">Nocturno</option>
            </select>

            <label for="tipo_vehiculo">Tipo de Vehículo:</label>
            <select id="tipo_vehiculo" name="tipo_vehiculo" required>
            <option value="" disabled selected>Seleccione...</option>
            <option value="carro">Carro</option>
            <option value="moto">Moto</option>
            </select>

            <label for="valor_tarifa">Valor de la Tarifa:</label>
            <input 
            type="number" 
            id="valor_tarifa" 
            name="valor_tarifa" 
            min="0" 
            max="999999" 
            placeholder="Ingrese el valor de la tarifa" 
            required
            >
        </fieldset>

        <fieldset>
            <legend>Horario Disponible</legend>

            <label for="hora_inicio">Hora de Inicio:</label>
            <input 
            type="time" 
            id="hora_inicio" 
            name="hora_inicio" 
            required
            >

            <label for="hora_fin">Hora de Fin:</label>
            <input 
            type="time" 
            id="hora_fin" 
            name="hora_fin" 
            required
            >
        </fieldset>

        <button type="submit">Guardar Tarifa</button>
        </form>

        <form action="/opciones" method="get">
        <button type="submit">Volver</button>
        </form>
    </main>

</body>
</html>
