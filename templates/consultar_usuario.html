<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Usuarios Registrados</title>
</head>
<body>

    <h1>Usuarios Registrados</h1>

    <table border="1">
        <thead>
            <tr>
                <th>Cédula</th>
                <th>Nombres</th>
                <th>Apellidos</th>
                <th>Correo</th>
                <th>Teléfono</th>
                <th>Tel. Emergencia</th>
                <th>Fecha Registro</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody>
            {% for u in usuarios %}
            <tr>
                <td>{{ u['cedula'] }}</td>
                <td>{{ u['nombres'] }}</td>
                <td>{{ u['apellidos'] }}</td>
                <td>{{ u['correo'] }}</td>
                <td>{{ u['telefono'] }}</td>
                <td>{{ u['tel_emergencia'] }}</td>
                <td>{{ u['fecha_registro'] }}</td>

                <td>
                    <form action="/modificar_usuario/{{ u['cedula'] }}" method="get" style="display:inline;">
                        <button type="submit">Modificar</button>
                    </form>

                    <form action="/eliminar_usuario/{{ u['cedula'] }}" method="post" style="display:inline;">
                        <button type="submit">Eliminar</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <br>

    <form action="/usuarios" method="get">
        <button type="submit">Volver</button>
    </form>

</body>
</html>
